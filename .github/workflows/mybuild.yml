name: Hchat 单 APK 编译

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 编译 Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取当前选择分支的代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 配置 Java 21
      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 3. 配置 Gradle 缓存
      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          validate-wrappers: false

      # 4. 配置 Android SDK
      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # 5. 检查项目配置
      - name: 检查构建环境
        run: |
          set -e

          echo "Java 版本："
          java -version

          echo "检查 Gradle Wrapper："
          test -f ./gradlew

          echo "检查 app 模块："
          test -f ./app/build.gradle.kts

          echo "环境检查通过"

      # 6. 编译单个 Debug APK
      - name: 编译 APK
        run: |
          set -e
          bash ./gradlew :app:assembleDebug --no-daemon

      # 7. 整理 APK
      - name: 整理 APK
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "错误：没有找到 Debug APK"
            find app/build/outputs/apk -type f -name "*.apk" || true
            exit 1
          fi

          mkdir -p dist
          cp "$APK" "dist/Hchat-debug.apk"

          echo "APK 已生成：dist/Hchat-debug.apk"
          ls -lh dist/Hchat-debug.apk

      # 8. 上传编译产物
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: Hchat-debug-apk
          path: dist/Hchat-debug.apk
          if-no-files-found: error
          retention-days: 7
